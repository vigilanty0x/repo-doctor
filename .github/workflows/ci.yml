name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install setuptools==80.9.0
      - name: Source verification
        run: python scripts/check.py
      - name: Offline source, wheel and sdist release gate
        env:
          PIP_NO_INDEX: "1"
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python scripts/release_gate.py

  package-tests:
    name: ${{ matrix.package }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - ai-setup-doctor
          - backup-verifier
          - config-drift-detector
          - container-resource-profiler
          - dependency-drift-reporter
          - docker-stack-doctor
          - duplicate-finder
          - healthcheck-hub
          - migration-verifier
          - port-conflict-doctor
          - repo-dependency-graph
          - service-doctor
          - sqlite-health-doctor
          - sqlite-query-plan-visualizer
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1"
      - name: Build package wheel
        run: python -m build --no-isolation --wheel
      - name: Install package wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Run package static checks
        run: python scripts/check.py
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Compile package sources and tests
        run: python -m compileall -q src tests
      - name: Import installed artifact outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_MODULE: ${{ matrix.package }}
        run: python -c "import importlib, os; importlib.import_module(os.environ['PACKAGE_MODULE'].replace('-', '_'))"
