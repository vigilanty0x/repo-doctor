[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="repo-dependency-graph"
version="0.1.0"
description="Validated repository dependency graph and cycle detector"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
repo-deps="repo_dependency_graph:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
