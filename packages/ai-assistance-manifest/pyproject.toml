[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistance-manifest"
version = "0.2.0"
description = "A portable, machine-readable disclosure format for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "provenance", "transparency", "manifest", "software-supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aim = "ai_assistance_manifest.cli:main"

[project.urls]
Homepage = "https://github.com/vigilanty0x/ai-assistance-manifest"
Issues = "https://github.com/vigilanty0x/ai-assistance-manifest/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_assistance_manifest = ["schema/*.json", "templates/*.json"]
