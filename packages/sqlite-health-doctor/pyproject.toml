[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-health-doctor"
version = "0.1.0"
description = "Read-only SQLite integrity, foreign-key, table, and index diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
sqlite-health-doctor = "sqlite_health_doctor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

