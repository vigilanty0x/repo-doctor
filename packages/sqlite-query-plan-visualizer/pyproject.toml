[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-query-plan-visualizer"
version = "0.1.0"
description = "Generate a real SQLite query plan in a validated isolated fixture."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
sqlite-query-plan-visualizer = "sqlite_query_plan_visualizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
