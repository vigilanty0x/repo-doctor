[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-onboarding-guide-generator"
version = "0.1.0"
description = "Render bounded onboarding guides from caller-supplied repository metadata."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
codebase-onboarding-guide-generator = "codebase_onboarding_guide_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
