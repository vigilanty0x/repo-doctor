[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="runbook-builder"
version="0.1.0"
description="Fail-closed operational runbook Markdown builder"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
runbook-builder="runbook_builder:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
