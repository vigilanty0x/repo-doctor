[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="document-factory"
version="0.1.0"
description="Deterministic bounded Markdown document renderer"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
document-factory="document_factory:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
