[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="system-map-generator"
version="0.1.0"
description="Validated synthetic system topology to Mermaid generator"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
system-map="system_map_generator:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
