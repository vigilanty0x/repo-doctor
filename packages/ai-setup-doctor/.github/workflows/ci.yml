name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check.py
      - run: python -m ai_setup_doctor diagnose --fixture examples/fixture.json --output /tmp/report.json || test $? -eq 2
      - run: python -m ai_setup_doctor verify /tmp/report.json
      - run: python -m ai_setup_doctor probe functional
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
